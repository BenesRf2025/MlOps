name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Entrainement
        run: python train.py
      - name: Tests API
        run: pytest -q
      - name: Build Docker
        run: docker build -t mpamboly-api:${{ github.sha }} .
      # Etape 5 (deploiement) : ajouter ici un push vers un registre
      # puis le deploiement (Render / Fly.io / VPS).
